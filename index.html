 <h3>${T('المنتجات','Products')} (${products.length})</h3><div class="al">${products.map(p=>{const sk=p.stock??99;return `<div class="ai"><div class="at">${pimg(p)?`<img src="${esc(pimg(p))}" alt="">`:'📦'}</div><div class="am"><b>${esc(p.title)}</b><small dir="ltr">${esc(p.code)}</small><div class="pr">${esc(p.price)} ${T('ج.م','EGP')} ${p.old>p.price?`<s class="old">${esc(p.old)}</s> 🏷️`:''}</div><div class="stp"><button class="ib" onclick="adj(${p.id},-1)">−</button><b class="${sk<=0?'low':''}">${p.stock===undefined?'∞':p.stock}</b><button class="ib" onclick="adj(${p.id},1)">+</button><small class="${sk<=0?'low':''}">${sk<=0?T('نفدت الكمية','Sold out'):T('بالمخزون','in stock')}</small></div></div><div class="aa"><button class="btn o" onclick="editP(${p.id})">${T('تعديل','Edit')}</button><button class="btn r" onclick="delP(${p.id})">${T('حذف','Delete')}</button></div></div>`}).join('')}</div>`;
}};
const msg=(t,ok)=>{if(!ok)toast(t,1);const m=$('#m');if(m)m.innerHTML=`<div class="msg ${ok?'s':'e'}">${esc(t)}</div>`};
function filt(){
 const ws=$('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),f=$('#f').value,mn=parseFloat($('#mn').value),mx=parseFloat($('#mx').value),s=$('#s').value;pq=$('#q').value;
 const l=products.filter(p=>{const h=(p.title+' '+p.desc+' '+p.code).toLowerCase();return ws.every(w=>h.includes(w))&&(!f||p.cat===f)&&(isNaN(mn)||p.price>=mn)&&(isNaN(mx)||p.price<=mx)});
 l.sort((a,b)=>s==='a'?a.price-b.price:s==='d'?b.price-a.price:s==='r'?avg(b.id)-avg(a.id):b.t-a.t);
 $('#rc').textContent=l.length+' '+T('منتج','result(s)');$('#pl').innerHTML=grid(l);
}
function signup(){
 const v=id=>$('#'+id).value.trim(),n=v('n'),p=v('p'),e=v('e'),w=$('#w').value,w2=$('#w2').value;
 if(n.split(/\s+/).length<3)return msg(T('أدخل الاسم الثلاثي','Enter your full three-part name'));
 if(!/^01[0125]\d{8}$/.test(p))return msg(T('رقم هاتف مصري غير صحيح','Invalid Egyptian phone number'));
 if(!/^\S+@\S+\.\S+$/.test(e))return msg(T('بريد إلكتروني غير صحيح','Invalid email'));
 if(w.length<6)return msg(T('كلمة السر 6 أحرف على الأقل','Password must be at least 6 characters'));
 if(w!==w2)return msg(T('كلمتا السر غير متطابقتين','Passwords do not match'));
 if(p===ADMIN.phone||users.some(u=>u.phone===p))return msg(T('رقم الهاتف مسجل بالفعل','Phone number already registered'));
 users.push({name:n,phone:p,email:e,gov:$('#g').value,pw:hash(w)});save('users',users);
 sessionStorage.fkok=1;go('login');
}
function login(){
 const p=$('#p').value.trim(),w=$('#w').value;
 if(p===ADMIN.phone&&hash(w)===ADMIN.h){sess={name:T('المدير','Admin'),phone:p,admin:true};save('sess',sess);if(cloud){sessionStorage.fkpw=w;fbLogin(w).then(ok=>{if(!ok)toast('⚠️ تعذّر الاتصال بالسحابة: راجع إعدادات Firebase',1)})}return go('admin')}
 const u=users.find(x=>x.phone===p&&x.pw===hash(w));
 if(!u)return msg(T('رقم الهاتف أو كلمة السر غير صحيحة','Wrong phone number or password'));
 sess={name:u.name.split(' ')[0],phone:u.phone};save('sess',sess);delete sessionStorage.fkok;go('account');
}
function logout(){fbTok='';delete sessionStorage.fkpw;sess=null;save('sess',null);go('home');route()}
function reserve(id){
 if(!sess){go('login');return}
 const p=products.find(x=>x.id===id);if(!p)return;
 const code='FK-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
 orders.push({code,id,title:p.title,price:p.price,phone:sess.phone,name:sess.name,t:Date.now()});save('orders',orders);
 const txt=`New order - El-Fakharany Store\nOrder code: ${code}\nProduct: ${p.title} (${p.code})\nPrice: ${p.price} EGP\nCustomer: ${sess.name} - ${sess.phone}`;
 $('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box"><h3 style="margin-top:0">${T('تم حجز طلبك ✅','Order reserved ✅')}</h3><p>${esc(p.title)}</p><div class="code">${code}</div>
 <a class="btn g" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(txt)}">Click Here to Send Code via WhatsApp<br>اضغط هنا لارسال الكود</a><br><button class="btn o" onclick="this.closest('.modal').remove()">${T('إغلاق','Close')}</button></div></div>`;
}
let fimgs=[];
function rImgs(){$('#ip').innerHTML=fimgs.map((u,i)=>`<div class="th"><img src="${esc(u)}" alt=""><button type="button" onclick="fimgs.splice(${i},1);rImgs()">✕</button></div>`).join('')||'<div class="ph" style="height:70px;width:70px;border-radius:.6rem">📦</div>'}
function addUrl(){const v=$('#iu').value.trim();if(!/^https?:\/\//i.test(v))return msg(T('رابط غير صحيح','Invalid URL'));fimgs.push(v);$('#iu').value='';rImgs()}
function readImg(inp){[...inp.files].slice(0,8).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);fimgs.push(c.toDataURL('image/jpeg',.72));rImgs()};im.onerror=()=>msg(T('ملف الصورة غير صالح','Invalid image file'));im.src=r.result};r.readAsDataURL(f)});inp.value=''}
function offUI(){const o=parseFloat($('#pr').value),t=$('#ot').value,v=parseFloat($('#ov').value);$('#ov').style.display=t?'':'none';let f=null;if(t==='pct'&&v>0&&v<100)f=Math.round(o*(100-v))/100;if(t==='fix'&&v>=0)f=v;$('#op2').textContent=f!=null&&o>0?T('السعر بعد العرض: ','Price after offer: ')+f+' '+T('ج.م','EGP')+' ('+T('بدلاً من ','was ')+o+')':''}
async function saveP(){
 if(!isAdmin())return;
 const v=id=>$('#'+id).value.trim(),eid=+v('eid'),orig=parseFloat(v('pr')),ot=v('ot'),ov=parseFloat(v('ov'));
 if(!v('t')||!(orig>=0))return msg(T('الاسم والسعر مطلوبين','Name and price are required'));
 let price=orig,old=0;
 if(ot==='pct'){if(!(ov>0&&ov<100))return msg(T('نسبة الخصم بين 1 و 99','Discount must be between 1 and 99'));old=orig;price=Math.round(orig*(100-ov))/100}
 else if(ot==='fix'){if(!(ov>=0&&ov<orig))return msg(T('سعر العرض يجب أن يكون أقل من السعر','Offer price must be lower than price'));old=orig;price=ov}
 let stock=v('sk')===''?undefined:Math.max(0,parseInt(v('sk'))||0);const ad=parseInt(v('ad'))||0;if(ad>0)stock=(stock??0)+ad;
 const o={title:v('t'),img:'',imgs:[...fimgs],info:v('inf'),desc:v('d'),price,old,cat:v('c'),code:v('cd')||'P-'+String(Date.now()).slice(-6),stock};
  if(products.some(p=>p.code===o.code&&p.id!==eid))return msg(T('كود المنتج مستخدم بالفعل','Product code already in use'));
 let p;if(eid){p=products.find(x=>x.id===eid);Object.assign(p,o)}else{p={...o,id:Date.now(),t:Date.now()};products.push(p)}
 save('products',products);toast(T('جارٍ الحفظ...','Saving...'));const ok=await cput(p);route();
 toast(!cloud?T('تم الحفظ على هذا الجهاز فقط (السحابة غير مفعّلة)','Saved on this device only'):ok?T('تم الحفظ ونشره لكل العملاء ✓','Saved & published ✓'):T('تم الحفظ محلياً لكن لم يُرفع للسحابة','Saved locally, not uploaded'),cloud&&!ok);
}
function editP(id){
 const p=products.find(x=>x.id===id),dc=p.old>p.price;
 $('#ft').textContent=T('تعديل منتج','Edit Product');$('#eid').value=id;$('#t').value=p.title;$('#d').value=p.desc;$('#c').value=p.cat;$('#cd').value=p.code;$('#sk').value=p.stock??'';$('#ad').value='';
 $('#pr').value=dc?p.old:p.price;$('#ot').value=dc?'fix':'';$('#ov').value=dc?p.price:'';fimgs=[...(p.imgs||(p.img?[p.img]:[]))];rImgs();$('#inf').value=p.info||'';offUI();scrollTo(0,0);
}
function adj(id,d){const p=products.find(x=>x.id===id);if(!p||!isAdmin())return;p.stock=Math.max(0,(p.stock??0)+d);save('products',products);cput(p);const y=scrollY;route();scrollTo(0,y)}
function delP(id){if(isAdmin()&&confirm(T('حذف المنتج؟','Delete this product?'))){products=products.filter(p=>p.id!==id);save('products',products);cdel(id);route()}}
const avg=id=>{const r=Object.values(ratings[id]||{});return r.length?r.reduce((a,b)=>a+b,0)/r.length:0};
const cartN=()=>cart.reduce((a,c)=>a+c.q,0);
function stars(id){const a=avg(id),n=Object.keys(ratings[id]||{}).length;return `<div class="stars">${[1,2,3,4,5].map(i=>`<span class="${a>=i-.5?'on':''}" onclick="rate(${id},${i})">★</span>`).join('')} <small>${n?a.toFixed(1)+' ('+n+')':T('لا تقييمات','No ratings')}</small></div>`}
function rate(id,n){if(!sess){go('login');return}(ratings[id]=ratings[id]||{})[sess.phone]=n;save('ratings',ratings);document.querySelectorAll('.sw[data-p="'+id+'"]').forEach(e=>e.innerHTML=stars(id))}
function toast(t,bad){const e=document.createElement('div');e.className='toast';e.textContent=t;if(bad)e.style.background='#dc2626';document.body.appendChild(e);setTimeout(()=>e.remove(),bad?3800:1800)}
function addCart(id){const p=products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(!p||(c?c.q:0)>=(p.stock??99)){toast(T('الكمية المتاحة لا تكفي','Not enough stock'));return}c?c.q++:cart.push({id,q:1});save('cart',cart);chrome();toast(T('تمت الإضافة للسلة ✓','Added to cart ✓'))}
function qty(id,d){const c=cart.find(x=>x.id===id),pp=products.find(x=>x.id===id);if(!c)return;if(d>0&&pp&&c.q>=(pp.stock??99)){toast(T('الكمية المتاحة لا تكفي','Not enough stock'));return}c.q+=d;if(c.q<1)cart=cart.filter(x=>x!==c);save('cart',cart);route()}
function hs(){pq=$('#hq').value;go('shop')}
function rst(){['q','mn','mx'].forEach(i=>$('#'+i).value='');$('#f').value='';$('#s').value='n';filt()}
const COUP={FAKHARANY10:10,WELCOME5:5},ST={pending:['قيد المراجعة','Pending'],confirmed:['تم التأكيد','Confirmed'],shipped:['تم الشحن','Shipped'],delivered:['تم التسليم','Delivered'],cancelled:['ملغي','Cancelled']};
const payName=k=>({cod:T('الدفع عند الاستلام','Cash on delivery'),vf:'Vodafone Cash',ip:'InstaPay'}[k]||'-');
function calc(){
 const it=cart.map(c=>({p:products.find(x=>x.id===c.id),q:c.q})).filter(x=>x.p),sub=it.reduce((a,x)=>a+x.p.price*x.q,0),pct=COUP[coupon]||0,ds=Math.round(sub*pct/100),net=sub-ds;
 const u=sess&&users.find(x=>x.phone===sess.phone),gov=u?u.gov:'',ship=!it.length||net>=1000?0:(['القاهرة','الجيزة'].includes(gov)?40:60);
 return {it,sub,pct,ds,ship,total:net+ship,u};
}
const recentHtml=()=>{const l=recent.map(i=>products.find(p=>p.id===i)).filter(Boolean).slice(0,4);return l.length?`<h2>${T('شاهدتها مؤخراً','Recently Viewed')}</h2>${grid(l)}`:''};
function applyC(){const v=$('#cp').value.trim().toUpperCase();coupon=COUP[v]?v:'';if(v&&!COUP[v])toast(T('كود غير صحيح','Invalid code'));else if(v)toast(T('تم تطبيق الخصم ✓','Discount applied ✓'));route()}
function setSt(code,st){if(!isAdmin())return;orders.forEach(x=>{if(x.code===code)x.status=st});save('orders',orders);route()}
function toggleW(id){wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];save('wish',wish);document.querySelectorAll('.heart[data-p="'+id+'"]').forEach(e=>e.textContent=wish.includes(id)?'❤️':'🤍');if(location.hash==='#wish')route()}
function openP(id){
 const p=products.find(x=>x.id===id);if(!p)return;recent=[id,...recent.filter(x=>x!==id)].slice(0,8);save('recent',recent);
 const sk=p.stock??99,dc=p.old>p.price?Math.round((1-p.price/p.old)*100):0,rel=products.filter(x=>x.id!==id&&x.cat===p.cat).slice(0,3);
 $('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box" style="max-width:720px;width:100%;max-height:90vh;overflow:auto;text-align:start"><div style="text-align:end"><button class="ib" onclick="this.closest('.modal').remove()">✕</button></div>
 ${gal(p)}
 <h3>${esc(p.title)}</h3><small>${T('كود','Code')}: ${esc(p.code)} · ${catName(p.cat)}</small><div class="sw" data-p="${id}">${stars(id)}</div>
 <div class="pr" style="font-size:1.4rem">${esc(p.price)} ${T('ج.م','EGP')} ${dc?`<s class="old">${esc(p.old)}</s> <span class="disc" style="position:static">-${dc}%</span>`:''}</div>
 <p class="${sk<=5?'low':''}">${sk<=0?T('نفدت الكمية','Out of stock'):sk<=5?T('متبقي '+sk+' فقط','Only '+sk+' left'):T('متوفر في المخزون','In stock')}</p><p>${esc(p.desc)}</p>${p.info?`<div class="inf">${esc(p.info).replace(/\n/g,'<br>')}</div>`:''}
 <div class="row"><button class="btn g" ${sk<=0?'disabled':''} onclick="addCart(${id})">🛒 ${T('أضف إلى السلة','Add to Cart')}</button><button class="btn o" onclick="toggleW(${id});this.textContent=(wish.includes(${id})?'❤️ ':'🤍 ')+'${T('المفضلة','Wishlist')}'">${wish.includes(id)?'❤️':'🤍'} ${T('المفضلة','Wishlist')}</button></div>
 <div class="cm" id="cm${id}" style="margin-top:1rem">${cmHtml(id)}</div>
 ${rel.length?`<p style="margin-bottom:.3rem"><b>${T('منتجات مشابهة','Related products')}</b></p><div class="row">${rel.map(x=>`<button class="btn o" onclick="openP(${x.id})">${esc(x.title)}</button>`).join('')}</div>`:''}</div></div>`;
}
async function confirmOrder(){
 if(!sess){go('login');return}
 await pull();const c=calc();if(!c.it.length)return;
 if(c.it.some(x=>x.q>(x.p.stock??99))){toast(T('بعض المنتجات كميتها غير كافية','Some items exceed available stock'),1);return}
 for(const x of c.it){if(!await cdec(x.p.id,x.q)){toast(T('نفدت كمية: ','Sold out: ')+x.p.title,1);await pull();return}}
 const u=c.u||{name:sess.name,phone:sess.phone,email:'-',gov:'-'};
 const code='FK-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
 c.it.forEach((x,i)=>{orders.push({code,id:x.p.id,title:x.p.title+' ×'+x.q,price:x.p.price*x.q,phone:sess.phone,name:sess.name,t:Date.now(),status:'pending',pay,...(i?{}:{ship:c.ship,ds:c.ds})});x.p.stock=Math.max(0,(x.p.stock??99)-x.q)});
 save('orders',orders);save('products',products);
 const txt=`New order - El-Fakharany Store\nOrder code: ${code}\n\nItems:\n`+c.it.map(x=>`- ${x.p.title} | Code: ${x.p.code} | Qty: ${x.q} | ${x.p.price*x.q} EGP`).join('\n')+`\n\nSubtotal: ${c.sub} EGP${c.ds?`\nDiscount (${coupon} ${c.pct}%): -${c.ds} EGP`:''}\nShipping: ${c.ship} EGP\nTotal: ${c.total} EGP\nPayment: ${payName(pay)}\n\nCustomer: ${u.name}\nPhone: ${u.phone}\nEmail: ${u.email}\nGovernorate: ${u.gov}`;
 const url=`https://wa.me/${SUP1}?text=${encodeURIComponent(txt)}`;
 cart=[];coupon='';save('cart',cart);
 try{window.open(url,'_blank','noopener')}catch(e){}
 $('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box"><h3 style="margin-top:0">${T('تم تأكيد طلبك ✅','Order confirmed ✅')}</h3><div class="code">${code}</div><p style="font-size:.85rem">${T('لو لم يفتح واتساب تلقائياً اضغط الزر لإرسال الطلب للدعم الأساسي. تابع حالة طلبك من صفحة المشتريات المحجوزة.','If WhatsApp did not open, tap below to send the order to Primary Support. Track your order status in Reserved Orders.')}</p>
 <a class="btn g" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="${url}">Click Here to Send Code via WhatsApp<br>اضغط هنا لارسال الكود</a><br><button class="btn o" onclick="this.closest('.modal').remove()">${T('إغلاق','Close')}</button></div></div>`;
 route();
}
function route(){
 let r=location.hash.slice(1)||'home';if(!V[r])r='home';
 drawer(0);chrome();$('#app').innerHTML=V[r]();if(r==='shop')filt();if(r==='admin'){fimgs=[];rImgs()}document.querySelectorAll('.rt').forEach(t=>{const h=[...t.rows[0].cells].map(c=>c.textContent);[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=h[i]||''))});scrollTo(0,0);
}
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('fk_')){products=load('products',products);comments=load('comments',{});orders=load('orders',[]);users=load('users',[]);route()}});
addEventListener('focusin',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&innerWidth<1024)document.body.classList.add('kb')});
addEventListener('focusout',()=>setTimeout(()=>{if(!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))document.body.classList.remove('kb')},150));
route();
if(cloud){pull();setInterval(pull,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
</script>
</body>
</html>
